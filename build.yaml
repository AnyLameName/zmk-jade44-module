# To turn on usb logging for either half, add this line to its entry:
#   snippet: zmk-usb-logging
---
include:
  - board: nice_nano//zmk
    shield: jade44_left nice_view_adapter nice_view_jade44
    snippet: zmk-usb-logging
  - board: nice_nano//zmk
    shield: jade44_right nice_view_adapter nice_view_jade44
