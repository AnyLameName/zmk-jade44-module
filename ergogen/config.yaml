meta:
  engine: 4.1.0
units:
  kx: cx
  ky: cy
  px: kx + 2.25
  py: ky + 2
points:
  zones:
    matrix:
      key.tags:
        - keys
      anchor.shift: [100, -150]
      rotate: 3
      columns:
        C1:
        C2:
          key.stagger: 3
        C3:
          key.origin: [-200, -20]
          key.splay: -3
          key.stagger: 12
        C4:
          key.stagger: 5
        C5:
          key.stagger: -6
        C6:
          key.stagger: -2
      rows:
        R1:
        R2:
        R3:
    thumb_fan:
      key.tags:
        - thumb_keys
      anchor:
        ref: matrix_C4_R1
        shift: [1, -(ky + 7)]
      columns:
        C3:
        C4.key.shift: [1, -1]
        C5.key.shift: [2, -2]
        C6.key.shift: [3, -2.75]
      rows:
        RT:
          splay: -6
    mcu:
      key.tags:
        - helper
      anchor:
        - ref: matrix_C6_R3
          shift: [20,-8]
    display:
      key.tags:
        - helper
      anchor:
        - ref: mcu
          shift: [0,-3.5]
    # Screw holes start top-left and circle clockwise.      
    screw_hole_1:
      key.tags:
        - screw_hole
      anchor:
        aggregate.parts: [matrix_C1_R2, matrix_C2_R3]
        shift: [-0.50, -1.25]
    screw_hole_2:
      key.tags:
        - screw_hole
      anchor:
        aggregate.parts: [matrix_C3_R2, matrix_C4_R3]
        shift: [-0.50, -2.25]
    screw_hole_3:
      key.tags:
        - screw_hole
      anchor:
        aggregate.parts: [matrix_C5_R2, matrix_C6_R3]
        shift: [0.40, -0.75]
    screw_hole_4:
      key.tags:
        - screw_hole
      anchor:
        aggregate.parts: [thumb_fan_C5_RT, thumb_fan_C6_RT]
        shift: [0, py/2 - 1]
    screw_hole_5:
      key.tags:
        - screw_hole
      anchor:
        aggregate.parts: [thumb_fan_C3_RT, matrix_C5_R1]
        shift: [-0.50, 0.25]
    screw_hole_6:
      key.tags:
        - screw_hole
      anchor:
        aggregate.parts: [matrix_C1_R2, matrix_C2_R2]
        shift: [-0.50, -(py/2 + 1.50)]
    power_switch:
      key.tags:
        - power_switch
      anchor:
        - ref: matrix_C6_R3
          rotate: 77
          shift: [0, 0.5py - 0.3]
    secondary_switch: # What footprint are we using for this? Thinking through hole reset switch with explicit NETs?
      key.tags:
        - secondary_switch
      anchor:
        - ref: matrix_C3_R3
          shift: [0, 0.5py]
    battery_jack:
      key.tags:
        - battery_jack
      anchor:
        - ref: matrix_C4_R2
          shift: [-3, -11.5]
          rotate: -63
    reset_switch:
      key.tags:
        - reset_switch
      anchor:
        - ref: matrix_C5_R3
          shift: [0, 0.5py + 1.25]
          rotate: -13
    encoder:
      key.tags:
        - encoder
      anchor:
        - ref: mcu
          shift: [0, -34]
          rotate: 180
outlines:
  _keycaps:
    - what: rectangle
      where: [keys, thumb_keys]
      size: [cx, cy]
      fillet: 1
  _keyswitches:
    - what: rectangle
      where: [keys, thumb_keys]
      size: [15, 15]
      fillet: 0.5
  _power_switch:
    - what: circle
      where: [power_switch]
      radius: 1
  _secondary_switch:
    - what: circle
      where: [secondary_switch]
      radius: 0.5
  _battery_jack:
    - what: rectangle
      where: [battery_jack]
      size: [6.5, 12]
  _reset_switch:
    - what: circle
      where: [reset_switch]
      radius: 1
  _encoder:
    - what: rectangle
      where: [encoder]
      size: [13.2, 14]
      fillet: 1.5
    - what: circle
      where: [encoder]
      radius: 3
      operation: stack
    - what: circle
      where: [encoder]
      radius: 3.3
      operation: stack
  _board:
    - what: polygon
      fillet: 1
      points: 
        # Start top left the board
        - ref: matrix_C1_R3
          shift: [-px/2, py/2]
        # Go directly to highest column  
        - ref: matrix_C4_R3
          shift: [-px/2, py/2]
        - shift: [px, 0]
        # Frame around the MCU  
        - ref: mcu
          shift: [-10, 16.85]
        - shift: [20, 0]
        # A nice vertical edge, maybe room for an encoder?
        - shift: [0, -69]
        - ref: thumb_fan_C6_RT
          shift: [px/2, py/2]
        - shift: [0, -py]
        # Fancy dance around the thumb fan  
        - aggregate:
            parts: [thumb_fan_C5_RT, thumb_fan_C6_RT]
          shift: [0, -py/2]
        - aggregate: 
            parts: [thumb_fan_C4_RT, thumb_fan_C5_RT]
          shift: [0, -py/2]
        - aggregate:
            parts: [thumb_fan_C3_RT, thumb_fan_C4_RT]
          shift: [0, -py/2]
        - ref: thumb_fan_C3_RT
          shift: [-px/2, -py/2]
        # Finish at bottom left of board, Ergogen will close the polygon off to the first point automatically.  
        - ref: matrix_C1_R1
          shift: [-px/2, -py/2]
    - what: circle
      radius: 2.2
      where: [screw_hole]
      operation: stack
  _mcu:
    - what: rectangle
      where: [mcu]
      size: [17.78,33]
      fillet: 1
    - what: rectangle
      where: [mcu]
      size: [8.94,7.35]
      fillet: 0.1
      operation: stack
      adjust:
        shift: [0,33/2-7.35/2+0.7]
  _display:
    - what: rectangle
      where: [display]
      size: [14,36]
      fillet: 0.5
    - what: rectangle
      where: [display]
      size: [12.82,2.66]
      operation: stack
      fillet: 0.1
      adjust:
        shift: [0,-16.7]
    - what: rectangle
      where: [display]
      size: [10.8,24.6]
      operation: stack
      adjust:
        shift: [0,-0.75]
  _mcu_cluster:
    - what: outline
      name: _mcu
      operation: stack
    - what: outline
      name: _display
      operation: stack
  preview:
    - what: outline
      name: _keycaps
    - what: outline
      name: _keyswitches
      operation: stack
    - what: outline
      name: _power_switch
      operation: stack
    - what: outline
      name: _secondary_switch
      operation: stack
    - what: outline
      name: _battery_jack
      operation: stack
    - what: outline
      name: _reset_switch
      operation: stack
    - what: outline
      name: _encoder
      operation: stack
    - what: outline
      name: _board
      operation: stack
    - what: outline
      name: _mcu_cluster
      operation: stack 
pcbs:
  jade44:
    template: kicad8
    outlines.main.outline: _board
    footprints:
      matrix_keys:
        what: ceoloide/switch_choc_v1_v2
        where: [keys]
        params: &switches
          choc_v1_support: false
          include_plated_holes: false
          include_stabilizer_pad: false
          from: "{{colrow}}"
          to: "{{col.name}}"
          hotswap: true
          hotswap_pads_same_side: true
          solder: false
          reversible: true
          switch_3dmodel_filename: '/home/jay/src/keyswitch_model/choc/v2/KiCad/lofree/wizard.step'
          switch_3dmodel_xyz_rotation: [0, 180, 0]
          switch_3dmodel_xyz_offset: [0, 0, -1.5]
          hotswap_3dmodel_filename: '/home/jay/src/keyswitch_model/socket/KiCad/choc.step'
          hotswap_3dmodel_xyz_rotation: [0, 180, 0]
          hotswap_3dmodel_xyz_offset: [0, -6, 1.5]
        adjust:
          rotate: 180
      thumb_keys:
        what: ceoloide/switch_choc_v1_v2
        where: [thumb_keys]
        params:
          <<: *switches
      diodes_for_matrix_keys:
        what: ceoloide/diode_tht_sod123
        where: [keys]
        params: &diodes
          side: B
          from: "{{colrow}}"
          to: "{{row}}"
          reversible: true
        adjust:
          shift: [-4.25, 1.0]
          rotate: 225
      diodes_for_thumb_keys:
        what: ceoloide/diode_tht_sod123
        where: [thumb_keys]
        params:
          <<: *diodes
        adjust:
          rotate: 180
          shift: [0, 9.5]
      controller:
        what: ceoloide/mcu_nice_nano
        where:
          ref: mcu
        params:
          reversible: true
          reverse_mount: true
          mcu_3dmodel_filename: '/home/jay/src/kb_ergogen_fp/3d_models/Nice_Nano_V2.step'
          # Pin names are Arduino pin names, not the MCU pin names.
          # For example, "P2" here refers to the pin labeled "D2" on the board in Arduino terms, 
          # which is P0.17 in Nice Nano V2 terms.
          # Left side, top to bottom.
          P1: CS
          P0: C1
          # Two GND pins here.
          P2: MOSI
          P3: SCK
          P4: C2
          P5: C3
          P6: C4
          P7: C5
          P8: C6
          P9: R1
          # Right side, bottom to top.
          # P10 and P16 are NFC pins. Skip them.
          P10: NC
          P16: NC
          P14: R2
          P15: R3
          P18: RT
          P19: NC
          P20: NC
          P21: NC
          # VCC, RST, GND, and RAW follow.
      display:
        what: ceoloide/display_nice_view
        where: display
        params:
          reversible: true
      power_switch:
        what: ceoloide/power_switch_smd_side
        where: [power_switch]
        params:
          side: F
          reversible: true
      battery_jack:
        what: ceoloide/battery_connector_jst_ph_2
        where: [battery_jack]
        params:
          reversible: true
          side: B
      reset_switch:
        what: ceoloide/reset_switch_smd_side
        where: [reset_switch]
        params:
          side: F
          reversible: true
      encoder:
        what: ceoloide/rotary_encoder_ec11_ec12
        where: [encoder]
        params:
          include_momentary_switch_pads: false
      m2_screws:
        what: ceoloide/mounting_hole_npth
        where: [screw_hole]
        params:
          hole_size: 4.6
          hole_drill: 2.2